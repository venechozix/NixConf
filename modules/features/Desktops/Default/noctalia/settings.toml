    [bar.Main]
    background_opacity = 0.0
    capsule = true
    capsule_thickness = 0.87999998405575752
    center = [ "workspaces" ]
    concave_edge_corners = false
    end = [ "tray", "bluetooth", "wallpaper", "notifications", "control-center" ]
    margin_ends = 0
    radius = 80
    shadow = false
    start = [ "launcher", "clock", "volume", "media", "group:g1" ]
    thickness = 30

        [bar.Main.monitor.DP-1]
        position = "left"

        [[bar.Main.capsule_group]]
